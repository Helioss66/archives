<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F1">
<title>Archives</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ink-layer" id="inkLayer">
  <svg class="ink-1" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="inkEdge1" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter></defs>
    <g filter="url(#inkEdge1)" fill="var(--accent)"><circle cx="210" cy="120" r="120"/><circle cx="130" cy="210" r="70"/></g>
  </svg>
  <svg class="ink-2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="inkEdge2" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter></defs>
    <g filter="url(#inkEdge2)" fill="var(--accent)"><circle cx="100" cy="100" r="80"/></g>
  </svg>
  <svg class="ink-3" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="inkEdge3" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34"/>
      <feGaussianBlur stdDeviation="8"/>
    </filter></defs>
    <g filter="url(#inkEdge3)" fill="var(--accent)"><circle cx="80" cy="80" r="65"/></g>
  </svg>
  <svg class="ink-4" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="inkEdge4" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="38"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter></defs>
    <g filter="url(#inkEdge4)" fill="var(--accent)"><circle cx="110" cy="110" r="85"/><circle cx="175" cy="55" r="18"/></g>
  </svg>
</div>
<div class="grain"></div>

<div class="auth-screen" id="authScreen">
  <h1 class="serif">Archives</h1>
  <p>Retrouve, trie et enrichis ce que tu as sauvegardé sur Instagram : films, recettes, choses à apprendre, et le reste.</p>
  <form id="authForm" style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;">
    <input type="email" id="authEmail" required placeholder="ton@email.com" autocomplete="email"
      style="padding:13px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper-raised); font-family:inherit; font-size:15px; text-align:center;">
    <button type="submit" class="google-btn" id="signInBtn" style="justify-content:center;">Recevoir un lien de connexion</button>
  </form>
  <p id="authMessage" style="display:none; font-size:13.5px; color: var(--accent);"></p>
</div>

<div class="app hidden" id="app">
  <header class="top">
    <span class="eyebrow">Archives</span>
    <h1 class="serif" id="tabTitle">—</h1>
    <p id="tabSub">— chargement —</p>
  </header>

  <div class="searchbar">
    <div class="searchbar-inner">
      <svg width="15" height="15" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="6" stroke="#6B6459" stroke-width="1.5"/><line x1="12.2" y1="12.2" x2="16" y2="16" stroke="#6B6459" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="search" placeholder="Rechercher…" autocomplete="off">
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <main id="list"></main>

  <button class="fab" id="fab">+</button>

  <nav class="tabs" id="tabs"></nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <h2 class="serif" id="sheetTitle">Nouvel élément</h2>
    <div id="sheetFields"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">Annuler</button>
      <button class="btn primary" id="saveBtn">
        Enregistrer
        <span class="nested-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.2 L5.6 10.3 L11.5 3.8" stroke="#FAF7F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none; margin-top:2px;">
      <button class="btn danger" id="deleteBtn">Supprimer cet élément</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="settingsBackdrop">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <h2 class="serif">Réglages</h2>
    <div id="collectionsManager"></div>
    <div class="sheet-actions" style="margin-top: 18px;">
      <button class="btn ghost" id="addCollectionBtn">+ Nouvelle collection</button>
    </div>
    <div class="sheet-actions" style="margin-top: 18px;">
      <button class="btn ghost" id="importSeedBtn">Importer les données de démo (103 items)</button>
    </div>
    <div class="sheet-actions" style="margin-top: 10px;">
      <button class="btn danger" id="signOutBtn">Se déconnecter</button>
    </div>
    <div class="sheet-actions" style="margin-top: 10px;">
      <button class="btn ghost" id="closeSettingsBtn">Fermer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
